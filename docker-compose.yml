# ============================================================
# Docker Compose — Cevichería D'Peñas
# ============================================================
# Levanta el backend (FastAPI) y el frontend (React + Vite)
# Uso: docker-compose up --build
# ============================================================

services:
  # --- Backend FastAPI ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cevicheria-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # --- Frontend React + Vite ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cevicheria-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
