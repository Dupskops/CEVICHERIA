# ============================================================
# Docker Compose PROD — Cevichería D'Peñas
# ============================================================
# Levanta backend (FastAPI) y frontend (React/nginx) en producción.
# Uso: docker-compose -f docker-compose.prod.yml up --build
# ============================================================

services:
  # --- Backend FastAPI (producción) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: cevicheria-backend-prod
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # --- Frontend React/nginx (producción) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    container_name: cevicheria-frontend-prod
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
